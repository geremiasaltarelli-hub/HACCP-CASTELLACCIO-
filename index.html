<!doctype html>
<html lang="it"><head><meta charset="utf-8">

<title>HACCP · Il Castellaccio</title>
<style>
:root{--bg:#f3f5f8;--fg:#17202e;--mut:#5b6778;--card:#fff;--line:#d3dae3;--ac:#1f3b63;--on:#fff;--bad:#c0392b;--wb:#fdeceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151d;--fg:#e8edf3;--mut:#9aa7b8;--card:#19212d;--line:#2d3a4b;--ac:#8db4ee;--on:#0b1220;--bad:#ff8a7b;--wb:#3a1d1d}}
:root[data-theme="dark"]{--bg:#10151d;--fg:#e8edf3;--mut:#9aa7b8;--card:#19212d;--line:#2d3a4b;--ac:#8db4ee;--on:#0b1220;--bad:#ff8a7b;--wb:#3a1d1d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--ac);color:var(--on);padding:10px 14px;z-index:5}
.top h1{margin:0;font-size:17px;font-weight:650}.bk{background:none;border:0;color:var(--on);font:inherit;padding:0 0 4px;min-height:32px}.bk[hidden]{display:none}
main{max-width:720px;margin:0 auto;padding:12px 14px 40px}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 8px;color:var(--fg);font:inherit;min-height:48px}
.row b{display:inline-block;min-width:68px;color:var(--ac)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}

input.bad{border-color:var(--bad);background:var(--wb);color:var(--bad);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.b{min-height:46px;padding:0 16px;border:1px solid var(--ac);border-radius:8px;background:var(--ac);color:var(--on);font:600 16px inherit;margin:4px 8px 4px 0}
.b.o{background:none;color:var(--ac)}
.ck{display:flex;gap:10px;align-items:center;color:var(--fg);font-size:15px;margin:0 0 6px;min-height:36px}.ck input{width:22px;min-height:22px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 8px}.dy{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:15px inherit;padding:0}.dy.on{background:var(--ac);color:var(--on);border-color:var(--ac)}.dy.al{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}.dy.sel{outline:3px solid var(--ac);outline-offset:1px}
.ck small{color:var(--mut)}
.dtl{width:100%;font-size:14px;color:var(--mut);padding:4px 0}.dtl[hidden]{display:none}
.pl{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 0;font-size:14px}.rlh{font-size:13px;color:var(--mut)}.rl{margin:0}
.gr{border:1px solid var(--line);border-radius:8px;background:var(--card);margin:0 0 8px;padding:0 10px}.gr summary{padding:12px 0;font-size:15px}.gr .it:last-child{border-bottom:0}.seg{display:flex;flex-wrap:wrap}.bd{color:var(--bad)}#qs{margin:6px 0 10px}
.dlb{background:var(--card);border:1px solid var(--ac);border-radius:8px;padding:10px;margin:0 0 10px;font-size:14px}
.it{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.x{background:none;border:0;color:var(--bad);font:14px inherit;min-height:40px}
.ing{display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;margin:0 0 8px;background:var(--card)}.ing input,.ing select{margin-top:0}.ing .acts{display:flex;justify-content:space-between}.ing input[hidden]{display:none}
.warn{background:var(--wb);color:var(--bad);border-radius:8px;padding:10px;margin:0 0 10px}.warn:empty{display:none}.warn .b{margin-top:8px;background:var(--bad);border-color:var(--bad)}
.st{text-align:center;color:var(--mut);font-size:12px}.msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;display:none}
h2{font-size:15px;margin:18px 0 6px}
#pr{display:none}
#spl{position:fixed;inset:0;z-index:99;background:#1f3b63;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;text-align:center;padding:20px}#spl b{font-size:22px;letter-spacing:.5px}#spl span{font-size:16px;opacity:.9}
#vw{position:fixed;inset:0;z-index:9;overflow:auto;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(8px + env(safe-area-inset-bottom,0px))}#vw[hidden]{display:none}#vw .pg{min-width:680px;margin:10px 0;padding:6px}
@media print{body>*:not(#pr){display:none!important}#pr{display:block}body{background:#fff}}

const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pad=n=>String(n).padStart(2,'0');

const R=[
{id:'temp',k:'g',doc:'01',t:'Registro delle temperature',o:'p',g:'Una volta al giorno, verificare che le temperature degli impianti siano ottimali, e registrare la temperatura rilevata. In caso di non conformità, compilare il Registro delle non conformità e provvedere al ripristino della funzionalità come da procedura.'},
{id:'san',k:'g',doc:'02',t:'Registro sanificazioni',o:'l'},
{id:'nc',k:'l',doc:'03',t:'Registro delle non conformità',o:'p',n:16,g:'Il registro delle non conformità si compila solo in caso di anomalie. Si riporta l\'anomalia riscontrata e le azioni correttive intraprese.',f:[['d','Data','d'],['p','Prodotto'],['fo','Fornitore'],['a','Descrizione anomalia'],['z','Azione correttiva (scarto, reso o altro)']]},
{id:'man',k:'l',doc:'04',t:'Registro manutenzione locali, attrezzature, impianti',o:'p',n:16,g:'In caso di manutenzione di locali, attrezzature, impianti, registrare e descrivere il tipo di intervento effettuato e firmare a garanzia di quanto riportato.',f:[['d','Data','d'],['l','Locale / attrezzature / impianti'],['i','Descrizione intervento'],['s','Firma']]},
{id:'lot',k:'l',doc:'05',t:'Registro lotti prodotti in ingresso',o:'l',n:12,g:'Compilare ad ogni ricevimento merce. Se il prodotto non è conforme, compilare anche il Registro delle non conformità.',f:[['d','Data ricevimento','d'],['p','Prodotto'],['fo','Fornitore'],['b','DDT / fattura n.'],['l','Lotto fornitore'],['sc','Scadenza','d'],['t','Temp. (°C)','n'],['c','Conforme (C/NC)','c'],['s','Firma']]},
{id:'aut',k:'l',doc:'',b:'Aziendale',t:'Prodotti aziendali (autoproduzione)',o:'l',n:10,nofoot:true,g:'Registrare ogni raccolta, macellazione o produzione di materia prima aziendale. Il lotto interno si genera da solo se lo lasci vuoto. Per la carne indicare il mattatoio e il suo documento; l’autofattura resta il documento fiscale.',f:[['d','Data (raccolta, macellazione, produzione)','d'],['p','Prodotto'],['q','Quantità'],['l','Lotto interno'],['o','Origine (frutteto, campo, allevamento)'],['m','Mattatoio e documento (carne)'],['a','Autofattura n. e data'],['sc','Da consumare entro','d'],['s','Firma']]},
{id:'abb',k:'l',doc:'06',t:'Registro delle operazioni di abbattimento',o:'l',n:12,f:[['d','Data','d'],['q','Quantità'],['p','Denominazione prodotto/semilavorato sottoposto ad abbattimento'],['t','Temperatura utilizzata (°C)','n'],['m','Tempo impiegato'],['ds','Data somministrazione','d'],['s','Firma']]},
{id:'prod',k:'l',doc:'07',t:'Registro produzioni',o:'l',n:10,f:[['d','Data di produzione','d'],['p','Denominazione prodotto'],['i','Ingredienti'],['e','Estremi identificativi degli ingredienti impiegati'],['l','Lotto attribuito'],['s','Firma operatore o delegato']]},
{id:'ric',k:'r',doc:'',b:'Ricette',t:'Prodotti e ingredienti'},
{id:'inv',k:'v',doc:'',b:'Invia',t:'Condividi più registri insieme'},
{id:'stag',k:'l',doc:'',t:'Registro produzioni – Stagionati',o:'l',n:10,g:'Compilare ad ogni produzione, attribuire un lotto interno. Per ogni materia prima indicare ditta, fattura n./data e lotto fornitore.',f:[['d','Data','d'],['q','Quantità'],['l','Lotto attribuito'],['c','Riferimenti carne','t','carne'],['b','Riferimenti budello','t','budello'],['pe','Riferimenti pepe','t','pepe'],['sa','Riferimenti sale','t','sale'],['s','Firma operatore']]}
];
let S={r:{},g:{},f:''},ref=null,V={id:null,m:TD.slice(0,7),d:TD.slice(8)},pre={};
const LS='haccp-castellaccio';
function save(){try{localStorage.setItem(LS,JSON.stringify({f:S.f}))}catch(e){}window.push&&push()}
function msg(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',2500)}
function boot(){let f='';try{f=JSON.parse(localStorage.getItem(LS)||'{}').f||''}catch(e){}S={r:{},g:{},f,rc:[]};$('#app').innerHTML='<p class="st">Caricamento…</p>';setTimeout(()=>{const p=$('#spl');if(p){p.style.opacity=0;setTimeout(()=>p.remove(),500)}},1600)}
let ED=-1,DL=null;function go(id){ED=-1;V.id=id;render();scrollTo(0,0)}
function render(){
 const r=R.find(x=>x.id===V.id);$('#bk').hidden=!r;$('#ti').textContent=r?(r.doc?'DOC '+r.doc+' · ':'')+r.t:'HACCP · Il Castellaccio';
 if(!r)$('#app').innerHTML='<p>Scegli il registro da compilare.</p>'+R.map(x=>`<button class="row" onclick="go('${x.id}')"><b>${x.b||(x.doc?'DOC '+x.doc:'Stagionati')}</b>${E(x.t)}</button>`).join('')+'<button class="b o" onclick="shareApp()">Condividi app</button>';
 else r.k==='g'?gridView(r):r.k==='r'?recView():r.k==='v'?sendView():listView(r)}
const rec=(id=V.id)=>((S.g[id]||{})[V.m]||{})[V.d]||{};
const bad=(k,v)=>v!==undefined&&v!==''&&!isNaN(v)&&(k==='FR1'?+v>-15:+v>6);

 const sdl=sc=>{const d=Math.round((new Date(sc)-new Date(TD))/864e5);return d<0?' · <b class="bd">SCADUTO</b>':d<=7?' · <b class="bd">scade tra '+d+(d===1?' giorno':' giorni')+'</b>':''};
 const byD=(a,b)=>(b[0].d||'').localeCompare(a[0].d||'');
 const byE=(a,b)=>{const x=a[0],y=b[0];if(!!x.ex!==!!y.ex)return x.ex?1:-1;if(!x.sc!==!y.sc)return x.sc?-1:1;return (x.sc||'').localeCompare(y.sc||'')||byD(a,b)};
 const mk=(arr,so=byD)=>arr.slice().sort(so).map(([x,i])=>`<div class="it"><span><b>${fmt(x.d)}</b> ${E(x[r.f[1][0]])}${r.f[2]?' · '+E(x[r.f[2][0]]):''}${r.id==='lot'?' · lotto '+E(x.l)+(x.sc?' · scad. '+fmt(x.sc)+(x.ex?'':sdl(x.sc)):'')+(x.ex?' · ESAURITO':''):''}${r.id==='aut'?' · lotto '+E(x.l)+(x.sc?' · entro '+fmt(x.sc)+(x.ex?'':sdl(x.sc)):'')+(x.ex?' · ESAURITO':''):''}${x.mod?' · modificata il '+fmt(x.mod.slice(0,10)):''}</span><span><button class="x" onclick="dt(this)">Dettagli</button><button class="x" onclick="ed(${i})">Modifica</button>${r.id==='prod'?`<button class="x" onclick="lab(${i})">Etichetta</button>`:''}${r.id==='lot'?`<button class="x" onclick="sameDel(${i})">Stessa consegna</button>`:''}${r.id==='lot'||r.id==='aut'?`<button class="x" onclick="ex('${r.id}',${i})">${x.ex?'Riattiva':'Esaurito'}</button>`:''}<button class="x" onclick="del('${r.id}',${i},this)">Elimina</button></span><div class="dtl" hidden>${r.f.map(([k,l,t])=>x[k]?`<div><b>${E(l)}:</b> ${E(t==='d'?fmt(x[k]):x[k])}</div>`:'').join('')}</div></div>`).join('');
 const q=nz(Q[r.id]||'').split(' ').filter(Boolean),vm=(r.id==='lot'||r.id==='aut')?(VM[r.id]||'e'):'d',g=vm==='g';
 let pr=rows.map((x,i)=>[x,i]).filter(([x])=>SHEX[r.id]||!x.ex);
 if(q.length)pr=pr.filter(([x])=>{const t=nz(r.f.map(([k])=>x[k]).join(' '));return q.every(w=>t.includes(w))});
 const nEx=rows.filter(x=>x.ex).length;let body;
 if(g){const gp={};pr.forEach(p=>{const k=nz(p[0].p)||'senza nome';(gp[k]=gp[k]||{n:p[0].p||'(senza nome)',a:[]}).a.push(p)});
  body=Object.values(gp).sort((x,y)=>nz(x.n).localeCompare(nz(y.n))).map(g=>{const at=g.a.filter(([x])=>!x.ex).length,sc=g.a.filter(([x])=>!x.ex&&x.sc).map(([x])=>x.sc).sort()[0];
   return `<details class="gr"${q.length?' open':''}><summary><b>${E(g.n)}</b> · ${at} ${at===1?'attivo':'attivi'}${g.a.length>at?' · '+(g.a.length-at)+(g.a.length-at===1?' esaurito':' esauriti'):''}${sc?' · scad. '+fmt(sc):''}</summary>${mk(g.a)}</details>`}).join('')}
 else{const lim=LIM[r.id]||40,so=vm==='e'?byE:byD,srt=pr.slice().sort(so);body=mk(srt.slice(0,lim),so)+(srt.length>lim?`<button class="b o" onclick="LIM['${r.id}']=(LIM['${r.id}']||40)+40;refList()">Mostra altri (${srt.length-lim})</button>`:'')}
 const bar='<div class="seg">'+((r.id==='lot'||r.id==='aut')?[['g','Per prodotto'],['d','Per data'],['e','Per scadenza']].map(([k,l])=>`<button class="b${vm===k?'':' o'}" onclick="VM['${r.id}']='${k}';refList()">${l}</button>`).join(''):'')+(nEx?`<button class="b o" onclick="SHEX['${r.id}']=!SHEX['${r.id}'];refList()">${SHEX[r.id]?'Nascondi':'Mostra'} esauriti (${nEx})</button>`:'')+'</div>';
 return bar+(q.length?`<p class="st" style="text-align:left">${pr.length} ${pr.length===1?'risultato':'risultati'}</p>`:'')+body}
function refList(){const r=R.find(x=>x.id===V.id),l=$('#lst');if(r&&l)l.innerHTML=listHtml(r)||'<p class="st">Ancora nessuna registrazione.</p>'}
function listView(r){
 const rows=S.r[r.id]||[],p=pre,eq=ED>=0?rows[ED]:null,bs=(r.id==='lot'&&DL&&!(ED>=0?rows[ED]:null))?DL:{};pre={};
 const inp=r.f.map(([k,l,t,w])=>`<label>${l}`+(w?`<select onchange="${r.id==='prod'?'pickp':'pick'}('${k}',this)">${lopt(w==='*'?'':w,!act0(w==='*'?'':w).length)}</select>`:'')+(t==='c'?`<select id="f_${k}"><option ${eq&&eq[k]==='NC'?'':'selected'}>C<option ${eq&&eq[k]==='NC'?'selected':''}>NC</select>`:`<input id="f_${k}" type="${t==='d'?'date':'text'}" ${t==='n'?'inputmode="decimal"':''} ${(r.id==='lot'&&(k==='p'||k==='fo'))||(r.id==='aut'&&k==='p')?'list="dl_'+k+'" autocomplete="off"':''}${(r.id==='lot'||r.id==='aut')&&k==='p'?' oninput="pv()"':''} value="${E(eq?(eq[k]??''):(p[k]??bs[k]??(k==='d'?TD:k==='s'?S.f:'')))}">`)+'</label>'+((r.id==='lot'||r.id==='aut')&&k==='p'?'<div id="prev"></div>':'')).join('');
 const bn=(r.id==='lot'&&DL&&!eq)?`<div class="dlb">Consegna aperta: <b>${E(DL.fo)}</b> · fattura/DDT <b>${E(DL.b)}</b> · ${fmt(DL.d)}<br>Compila solo prodotto, lotto e scadenza. Per un altro fornitore o un'altra fattura chiudi la consegna.<br><button class="x" onclick="DL=null;render()">Chiudi consegna</button></div>`:'';
 const dls=r.id==='aut'?`<datalist id="dl_p">${[...new Set([...BASE,...rows.map(x=>x.p).filter(Boolean)])].map(v=>`<option value="${E(v)}">`).join('')}</datalist>`:r.id==='lot'?['p','fo'].map(k=>`<datalist id="dl_${k}">${[...new Set((k==='p'?[...rows,...(S.r.aut||[])]:rows).map(x=>x[k]).concat(k==='p'?BASE:[]).filter(Boolean))].map(v=>`<option value="${E(v)}">`).join('')}</datalist>`).join(''):'';
 const list=listHtml(r);
 $('#app').innerHTML=`<div><button class="b o" onclick="document.getElementById('reg').scrollIntoView()">Vedi registrazioni (${rows.length})</button><button class="b o" onclick="vw('${r.id}')">Visualizza scheda</button></div>${r.id==='prod'?rc1():''}${bn}${inp}${dls}<button class="b" onclick="add('${r.id}')">${eq?'Salva modifiche':'Aggiungi'}</button>${eq?'<button class="b o" onclick="ED=-1;render()">Annulla</button>':''}${r.id==='prod'?rc2():''}<h2 id="reg">Registrazioni (${rows.length})</h2><input id="qs" type="search" placeholder="Cerca per prodotto, fornitore o lotto" value="${E(Q[r.id]||'')}" oninput="Q['${r.id}']=this.value;LIM['${r.id}']=40;refList()"><div id="lst">${list||'<p class="st">Ancora nessuna registrazione.</p>'}</div>${pbtn(r)}`}
const BASE=['Mele','Mirtilli','Prugne','Noci','Uova','Carne di maiale','Agnello'];
const au=x=>({p:x.p,fo:'Produzione aziendale',b:x.a||'',l:x.l,sc:x.sc});
const gl=v=>String(v)[0]==='a'?au(S.r.aut[+String(v).slice(1)]):S.r.lot[+v];
const nz=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const mt=(p,w,pt)=>{const a=nz(p).split(' '),b=nz(w).split(' ').filter(Boolean),n=b.length;if(!n)return false;const e=(x,y,l)=>pt&&l?x.startsWith(y):x===y;if(!e(a[0],b[0],n===1))return false;let j=1;for(let i=1;i<a.length&&j<n;i++)if(e(a[i],b[j],j===n-1))j++;return j===n};
const act0=(w,pt)=>{const a=[];(S.r.lot||[]).forEach((x,i)=>{if(!x.ex&&x.c!=='NC'&&(!x.sc||x.sc>=TD))a.push([x,String(i)])});(S.r.aut||[]).forEach((x,i)=>{if(!x.ex&&(!x.sc||x.sc>=TD))a.push([au(x),'a'+i])});return w?a.filter(([x])=>mt(x.p,w,pt)):a};
const lopt=(w,all,pt)=>{const a=(all||!w)?act0(''):act0(w,pt);return`<option value="">${a.length?'Scegli il lotto':(all||!w?'Nessun lotto attivo (compila il DOC 05)':'Nessun lotto per questo ingrediente')}</option>`+a.map(([x,i])=>`<option value="${i}">${E(x.p)} – ${E(x.fo)} – lotto ${E(x.l)}${x.sc?' – scad. '+fmt(x.sc):''}</option>`).join('')};
const lt=(m,x)=>x.fo==='Produzione aziendale'?`${m}: produzione aziendale, ${x.b?'autofattura '+x.b+', ':''}lotto ${x.l}`:`${m}: ${x.fo}, doc. ${x.b}, lotto ${x.l}`;
